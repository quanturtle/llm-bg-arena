[project]
name = "boardgames"
version = "0.1.0"
description = "Code board games once, then let language models and bots play them against each other."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
arena = "boardgames.arena.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boardgames"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["boardgames", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
