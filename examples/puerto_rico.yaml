# A three-player Puerto Rico game between cheap models, capped at three rounds.
# Every setting sits on the seat it applies to.
# Needs OPENROUTER_API_KEY in the environment or in .env.
game: puerto_rico
config: {num_players: 3, max_rounds: 3}
seed: 1
seats:
  - model: qwen/qwen3.7-flash
    reasoning: false
    temperature: 0.3
  - model: openai/gpt-5-nano
    reasoning_effort: low
  - model: mistralai/mistral-small-3.2-24b-instruct
    label: mistral small
    temperature: 0.3
    persona: Play patiently and plan for the buildings that score at the end.
